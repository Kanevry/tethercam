name: ci-plugin

# Pull-request and main-branch CI. No signing, no secrets, no notarization:
# this workflow must pass in a fork with zero configuration.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    # The shared/ C core is deliberately free of Apple frameworks, so it is tested on
    # Linux — that is the check that keeps it portable.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, test
        run: |
          set -euo pipefail
          cmake -S shared -B shared/build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build shared/build
          ctest --test-dir shared/build --output-on-failure

      - name: Test with sanitizers
        run: |
          set -euo pipefail
          cmake -S shared -B shared/build-asan -DIUCM_SANITIZE=ON
          cmake --build shared/build-asan
          ctest --test-dir shared/build-asan --output-on-failure

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PLUGIN_NAME: obs-iphone-usb-cam
    steps:
      - uses: actions/checkout@v4

      # OBS requires the macOS 15.0 SDK (Xcode 16.0+); macos-14 ships SDK 14.5 and
      # fails with "Your macOS SDK version (14.5) is too low". Xcode 16 also introduced
      # the pbxproj objectVersion 77 that xcodegen emits, so this same select fixes the
      # "future Xcode project file format (77)" error. Newest is picked at run time
      # rather than pinned, so a runner-image refresh cannot break the job.
      - name: Select the newest Xcode (16.0 or newer)
        run: |
          set -euo pipefail
          find /Applications -maxdepth 1 -name 'Xcode*.app'
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Cache obs-deps
        uses: actions/cache@v4
        with:
          path: obs-plugin/.deps
          key: obs-deps-macos-15-${{ hashFiles('obs-plugin/buildspec.json') }}
          restore-keys: obs-deps-macos-15-

      - name: Build the plugin (ad-hoc signed)
        working-directory: obs-plugin
        env:
          CI: 1
          # "-" is ad-hoc signing. No certificate, no secrets, loads locally, not
          # distributable. CI=1 also stops the template from prompting interactively.
          CODESIGN_IDENT: "-"
          CODESIGN_TEAM: ""
        run: |
          set -euo pipefail
          cmake --preset macos
          cmake --build --preset macos
          lipo -info "build_macos/RelWithDebInfo/${PLUGIN_NAME}.plugin/Contents/MacOS/${PLUGIN_NAME}"

      - name: Package smoke test
        run: |
          set -euo pipefail
          bash packaging/build-pkg.sh \
            --plugin "obs-plugin/build_macos/RelWithDebInfo/${PLUGIN_NAME}.plugin" \
            --version "0.0.0-ci" \
            --out "$RUNNER_TEMP/dist"
          pkgutil --expand "$RUNNER_TEMP/dist/TetherCam-obs-plugin.pkg" "$RUNNER_TEMP/expanded"
          lsbom -s "$RUNNER_TEMP"/expanded/*component.pkg/Bom | grep -F 'obs-studio/plugins' | head -3

      - name: swift test (tools)
        run: swift test --package-path tools

      - name: shellcheck
        run: |
          set -euo pipefail
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck scripts/install.sh scripts/release.sh packaging/build-pkg.sh tools/integration.sh

      - name: ffmpeg for the integration run
        run: brew install ffmpeg

      # Marked non-blocking on purpose. integration.sh needs no camera — usbcam-sim
      # generates a test pattern — but it does need a working VideoToolbox *HEVC
      # encoder*, and on the virtualised Apple-silicon runners the availability of the
      # hardware encoder is not contractual: VTCompressionSession creation can fall back
      # to software or fail outright depending on the image. The script also asserts a
      # >=25 fps average and <50 ms ping RTT, which are timing thresholds that a shared
      # CI VM can miss without anything being wrong with the code. Treat a failure here
      # as a signal to read the log, not as a broken build. Flip continue-on-error off
      # once a few runs have shown it to be stable.
      - name: integration.sh (end to end against the simulator)
        continue-on-error: true
        env:
          FFMPEG: /opt/homebrew/bin/ffmpeg
          FFPROBE: /opt/homebrew/bin/ffprobe
        run: bash tools/integration.sh

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # xcodegen 2.46 emits pbxproj objectVersion 77, which only Xcode 16.0+ can read;
      # the macos-14 image (Xcode 15.x) failed with "the project 'TetherCam' cannot be
      # opened because it is in a future Xcode project file format (77)". Newest is
      # picked at run time rather than pinned, so an image refresh cannot break it.
      - name: Select the newest Xcode (16.0 or newer)
        run: |
          set -euo pipefail
          find /Applications -maxdepth 1 -name 'Xcode*.app'
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios-app
        run: xcodegen generate
      - name: Unit tests on the simulator
        working-directory: ios-app
        # Simulator tests need no signing; CODE_SIGNING_ALLOWED=NO keeps the job free
        # of provisioning-profile requirements so forks can run it. The device name is
        # resolved at run time from the runner's own list instead of being pinned:
        # runner images retire model names between updates ('iPhone 15' is gone from
        # some macos-15 images), and a stale name fails the job with an unhelpful
        # "Unable to find a device matching the provided destination specifier".
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          # Every device line is "  <name> (<UDID>) (<state>)"; take the name only.
          # Prefer an iPhone, fall back to whatever the image actually has.
          names="$(xcrun simctl list devices available \
            | sed -n 's/^[[:space:]]*\(.*\) ([0-9A-F-]\{36\}) (.*/\1/p')"
          device="$(printf '%s\n' "$names" | grep -m1 '^iPhone' || true)"
          [ -n "$device" ] || device="$(printf '%s\n' "$names" | head -1)"
          test -n "$device" || { echo "no available iOS simulator" >&2; exit 1; }
          echo "Using simulator: $device"
          xcodebuild test \
            -project TetherCam.xcodeproj \
            -scheme TetherCam \
            -destination "platform=iOS Simulator,name=$device" \
            CODE_SIGNING_ALLOWED=NO
