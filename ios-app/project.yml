name: UsbCam
options:
  bundleIdPrefix: at.gotzendorfer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  UsbCam:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.gotzendorfer.usbcam
        PRODUCT_NAME: UsbCam
        DEVELOPMENT_TEAM: G3QZ66475M
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Das Kamerabild wird per USB-Kabel an den Mac uebertragen."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Lokaler Listener auf TCP 7878 fuer die USB-Verbindung zum Mac."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeRight UIInterfaceOrientationLandscapeLeft"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  UsbCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: UsbCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.gotzendorfer.usbcam.tests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: G3QZ66475M
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  UsbCam:
    build:
      targets:
        UsbCam: all
        UsbCamTests: [test]
    test:
      targets:
        - UsbCamTests
