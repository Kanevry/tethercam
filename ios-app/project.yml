name: UsbCam
options:
  bundleIdPrefix: at.gotzendorfer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # xcodegen 2.46 / XcodeProj always writes objectVersion = 77 (its
  # preferredProjectObjectVersion); `options.objectVersion` and
  # `options.compatibilityVersion` are silently ignored — verified by generating with
  # both set and grepping the result. Format 77 was introduced by Xcode 16.0, so the
  # "future Xcode project file format (77)" failure on the CI runner was an Xcode-15
  # runner (macos-14 / SDK 14.5), not a spec defect. The workflows therefore run on
  # macos-15 and select an Xcode 16.x or newer. xcodeVersion below only pins
  # LastUpgradeCheck (verified: 1430 -> 1600) and documents that intent in the project.
  xcodeVersion: "1600"

targets:
  UsbCam:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.gotzendorfer.usbcam
        PRODUCT_NAME: UsbCam
        DEVELOPMENT_TEAM: G3QZ66475M
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Das Kamerabild wird per USB-Kabel an den Mac uebertragen."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Lokaler Listener auf TCP 7878 fuer die USB-Verbindung zum Mac."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeRight UIInterfaceOrientationLandscapeLeft"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  UsbCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: UsbCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.gotzendorfer.usbcam.tests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: G3QZ66475M
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  UsbCam:
    build:
      targets:
        UsbCam: all
        UsbCamTests: [test]
    test:
      targets:
        - UsbCamTests
